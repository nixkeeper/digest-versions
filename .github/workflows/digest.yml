name: "Digest: Repology's nixpkgs projects"

# Keeps the digest (the data branch: data/projects.jsonl.gz and data/meta.json)
# up to date with Repology, every 12 hours, each run done before one of
# nixkeeper's syncs (06:15 and 18:15 UTC): every outdated nixpkgs project,
# the ones no longer outdated, and a fourteenth of all nixpkgs' projects, so
# each is read weekly (nixkeeper_versions/cli.py). About 325 requests to
# Repology's API a run, one a second, at most 465 (under its 1,000 a day
# with two runs); Typst Universe's index, one
# request (data/typst.json.gz); the Emacs archives' indexes, four
# (data/emacs.json.gz); Stackage LTS, two (data/stackage.json.gz); CRAN and
# Bioconductor, five (data/cran.json.gz); and GitHub
# releases (data/releases.json.gz): weekly, an evaluation of nixpkgs for
# where packages come from (Nix, about a minute), each run every one of their
# repositories, 25 a GraphQL query (about 860 points, an hour: the run
# takes about 75 minutes). The data branch is main plus one commit with the
# digest (scripts/data-branch.sh).

on:
  schedule:
    # The fallback, 05:37 and 17:37 UTC: the runs are started through the
    # API from outside GitHub at 04:15 and 16:15 (its schedule comes hours
    # late when busy: 16:07's at 22:53, 2026-10-12, and the outside start 5
    # hours after found the digest fresh and stopped). Scheduled after
    # them, with if_older, a scheduled run finds the digest fresh and stops
    # however late it comes, and sweeps only when the outside start didn't
    # (then over 13 hours old). Alone (a fork), it sweeps every 12 hours.
    - cron: '37 5,17 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: "Read all nixpkgs projects (about an hour), not a fourteenth"
        type: boolean
        default: false
      if_older:
        description: "Only if the last run is older than this many hours (empty: always)"
        type: string
        default: ""
      sources_only:
        description: "The other sources only (Typst, Emacs, Stackage, CRAN, GitHub), no Repology"
        type: boolean
        default: false

# One run at a time: a run waits for the last instead of cancelling it.
concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write  # publishes the data branch

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Python's output as it's printed, not when the run ends: a run cut off
    # at its time limit then shows where it got to (digest-builds, 2026-10-26).
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Restore the last published digest, on main
        run: bash scripts/data-branch.sh restore

      # Nix: GitHub releases evaluate nixpkgs, with nixkeeper's code (the
      # flake's input).
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Bring the digest up to date
        run: >-
          nix run . -- data
          ${{ inputs.full && '--full' || '' }}
          ${{ inputs.sources_only && '--sources-only' || '' }}
          ${IF_OLDER:+--if-older "$IF_OLDER"}
        env:
          # Scheduled runs too: the outside start comes first. (An
          # input reaches the shell as a variable, never as code.)
          IF_OLDER: ${{ github.event_name == 'schedule' && '10' || inputs.if_older }}
          # GitHub releases' GraphQL queries: public repositories' tags only.
          # GitHub releases: NIXKEEPER_VERSIONS_TOKEN, a personal token
          # reading public repositories only (5,000 points an hour); without
          # it, the workflow's own (1,000: about enough, a run that gets low
          # stops and reads the rest first the next day).
          GITHUB_TOKEN: ${{ secrets.NIXKEEPER_VERSIONS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish the digest if it changed
        run: |
          bash scripts/data-branch.sh publish "digest: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

# Settings for ruff (`nix fmt`, and the lint check); nothing is installed
# from here: the workflow runs the code with `nix run .` (flake.nix), beside
# nixkeeper's source (GitHub releases use its code).
[project]
name = "nixkeeper-versions"
version = "0.1.0"
description = "A digest of nixpkgs' packages' upstream versions, for nixkeeper."
license = "MIT"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88  # Python's standard (Black / ruff default)

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade, simplify, isort
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
